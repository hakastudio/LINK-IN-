<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevateLink | Professional Bio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FDF8F3;
        }
        .font-heading {
            font-family: 'Space+Grotesk', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        @keyframes profile-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes btn-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }
        @keyframes fade-up {
            from { 
                opacity: 0; 
                transform: translateY(24px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        @keyframes wave-flow {
            0% { transform: translateX(0) skewY(-2deg); }
            50% { transform: translateX(-25%) skewY(1deg); }
            100% { transform: translateX(-50%) skewY(-2deg); }
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes shine {
            0% { transform: translateX(-150%) skewX(-20deg); }
            100% { transform: translateX(250%) skewX(-20deg); }
        }
        @keyframes float-bob {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        @keyframes social-entrance {
            from { 
                opacity: 0; 
                transform: scale(0.5) translateY(20px); 
            }
            to { 
                opacity: 1; 
                transform: scale(1) translateY(0); 
            }
        }
        .animate-blob {
            animation: blob 7s infinite alternate;
        }
        .animate-profile-pulse {
            animation: profile-pulse 4s ease-in-out infinite;
        }
        .animate-spin-slow {
            animation: spin-slow 15s linear infinite;
        }
        .animate-btn-pulse {
            animation: btn-pulse 3s ease-in-out infinite;
        }
        .animate-fade-up {
            animation: fade-up 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .animate-wave {
            animation: wave-flow 25s ease-in-out infinite;
        }
        .animate-float-slow {
            animation: float-slow 10s ease-in-out infinite;
        }
        .animate-shine {
            animation: shine 1.2s ease-in-out infinite;
        }
        .animate-social-entrance {
            animation: social-entrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .animate-float-bob {
            animation: float-bob 4s ease-in-out infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
<body class="overflow-x-hidden">
    <div id="root"></div>
</body>
</html>
